<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Studio Baran project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<main id="main"></main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js?v=20261016b"></script>
<script src="js/main.js?v=20261014b"></script>
<script>
  renderChrome("studio-baran/");
  const item = STUDIO_BARAN_PROJECTS.find((p) => p.slug === getParam("slug"));
  const main = qs("#main");

  if (requireItem(item, main)) {
    document.title = item.title + " — Studio Baran";

    main.innerHTML = `
      <div class="wrap detail-head">
        <a class="back" href="studio-baran/">← All Studio Baran projects</a>
        <p class="identity-flag">Studio Baran — independent practice</p>
        <h1 class="display-lg" style="margin-top:1rem;">${escapeHtml(item.title)}</h1>
        ${metaRowHTML([
          ["Studio", "Studio Baran"],
          ["Role", item.role || "Founder / Designer"],
          ["Category", item.category],
          ["Location", item.location],
          ["Year", item.year],
        ])}
        ${item.projectUrl ? `<a class="project-link" href="${escapeHtml(item.projectUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.projectLinkLabel || "Project reference")} ↗</a>` : ""}
      </div>

      <section style="border-top:none; padding-top:0;">
        <div class="wrap">
          <div id="hero-plate" style="cursor:pointer;">${plateHTML({ src: item.heroImage, ratio: "hero", label: item.title + " — hero image" })}</div>
          ${item.heroCredit ? `<p class="image-credit">${escapeHtml(item.heroCredit)}</p>` : ""}
        </div>
      </section>

      ${item.concept ? `
      <section>
        <div class="wrap" style="max-width: 800px;">
          <p class="label" style="margin-bottom:1rem;">Concept</p>
          <p class="prose">${escapeHtml(item.concept)}</p>
        </div>
      </section>` : ""}

      ${item.process ? `
      <section>
        <div class="wrap" style="max-width: 800px;">
          <p class="label" style="margin-bottom:1rem;">Process</p>
          <p class="prose">${escapeHtml(item.process)}</p>
        </div>
      </section>` : ""}

      ${item.processImages && item.processImages.length ? `
      <section>
        <div class="wrap">
          <p class="label" style="margin-bottom:1.5rem;">Process &amp; material studies</p>
          <div class="thumb-grid" id="process-grid"></div>
        </div>
      </section>` : ""}

      ${item.images && item.images.length ? `
      <section>
        <div class="wrap">
          <p class="label" style="margin-bottom:1.5rem;">Result</p>
          <div class="thumb-grid" id="result-grid"></div>
        </div>
      </section>` : ""}
    `;

    qs("#hero-plate").addEventListener("click", () => {
      Lightbox.open([{ src: item.heroImage, title: item.title, meta: item.category + " — " + item.year }], 0);
    });

    if (item.processImages && item.processImages.length) {
      buildLightboxGrid(qs("#process-grid"), item.processImages, () => "Process study — " + item.title);
    }

    if (item.images && item.images.length) {
      buildLightboxGrid(qs("#result-grid"), item.images, (i) => item.title + " — view " + (i + 1));
    }
  }
</script>

</body>
</html>
