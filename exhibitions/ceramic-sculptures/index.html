<body>

<header id="site-header" class="site-header"></header>

<main>
  <section style="border-top:none;">
    <div class="wrap">
      <p class="label">Exhibitions</p>
      <h1 class="display-lg" style="margin-top: 0.6rem;">Exhibitions</h1>
      <p class="prose" style="margin-top: 1.5rem; max-width: 65ch;">A selection of spatial projects, installations and artworks presented in public.</p>
    </div>
  </section>

  <section style="padding-top: 0;">
    <div class="wrap" id="exhibitions-list"></div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js?v=20261016c"></script>
<script src="js/main.js?v=20261014b"></script>
<script>
  renderChrome("exhibitions/");

  const byYear = {};
  EXHIBITIONS.forEach((e) => { (byYear[e.year] = byYear[e.year] || []).push(e); });
  const years = Object.keys(byYear).sort((a, b) => b - a);

  qs("#exhibitions-list").innerHTML = years.map((y) => `
    <div class="year-group">
      <div class="year">${escapeHtml(y)}</div>
      <div class="entries">
        ${byYear[y].map((e) => `
          <a href="exhibitions/${encodeURIComponent(e.slug)}/">
            <p class="entry-title">${escapeHtml(e.title)}</p>
            <p class="entry-meta">${escapeHtml([e.institution, e.location].filter(Boolean).join(" — "))}</p>
          </a>
        `).join("")}
      </div>
    </div>
  `).join("");
</script>

<script src="js/clean-routes.js?v=20261014b"></script>
</body>
