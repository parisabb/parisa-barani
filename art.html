<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art — Parisa Barani</title>
<meta name="description" content="Personal art practice — paintings and sculpture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <section style="border-top:none;">
    <div class="wrap">
      <p class="label">Art</p>
      <h1 class="display-lg" style="margin-top: 0.6rem;">Painting and sculpture.</h1>
      <p class="prose" style="margin-top: 1.5rem; max-width: 65ch;">Blurring the boundaries between reality and imagination, each work invites reflection, curiosity and personal connection. The practice considers freedom in its many forms, honouring the beauty of dreams and the resilience of those who make their own way.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="thumb-grid" id="art-grid"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  renderChrome("art.html");
  qs("#art-grid").innerHTML = ARTWORKS.map((a) => thumbCardHTML({
    href: "art-detail.html?slug=" + encodeURIComponent(a.slug),
    src: a.image,
    title: a.title,
    meta: a.year,
    status: a.availability || "sold",
  })).join("");
</script>

</body>
</html>
