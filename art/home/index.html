<script src="js/data.js?v=20261016b"></script>
<script src="js/main.js?v=20261014b"></script>
<script>
  renderChrome("art/");
  const artworksByNewest = [...ARTWORKS].sort((a, b) => Number(b.year || 0) - Number(a.year || 0));
  qs("#art-grid").innerHTML = artworksByNewest.map((a) => thumbCardHTML({
    href: "art/" + encodeURIComponent(a.slug) + "/",
    src: a.image,
    title: a.title,
    meta: a.year,
    status: a.availability || "sold",
  })).join("");
</script>

<script src="js/clean-routes.js?v=20261014b"></script>
